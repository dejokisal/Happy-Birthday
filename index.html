<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Untuk Alida Ayuna Iskandar 💗</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 190, 215, .35), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(255, 220, 170, .25), transparent 30%),
                linear-gradient(135deg, #fff8fb, #fce8f0 50%, #fff5e8);
            color: #5a3b48;
            position: relative;
        }

        /* =========================
           BACKGROUND PARTICLES
        ========================= */

        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #d6a85f;
            border-radius: 50%;
            opacity: .6;
            animation: twinkle 3s infinite ease-in-out;
        }

        .sparkle:nth-child(1) {
            top: 12%;
            left: 12%;
            animation-delay: .3s;
        }

        .sparkle:nth-child(2) {
            top: 20%;
            left: 82%;
            animation-delay: 1s;
        }

        .sparkle:nth-child(3) {
            top: 72%;
            left: 8%;
            animation-delay: 1.7s;
        }

        .sparkle:nth-child(4) {
            top: 85%;
            left: 88%;
            animation-delay: 2.2s;
        }

        .sparkle:nth-child(5) {
            top: 45%;
            left: 94%;
            animation-delay: .8s;
        }

        .sparkle:nth-child(6) {
            top: 8%;
            left: 52%;
            animation-delay: 1.4s;
        }

        @keyframes twinkle {
            0%, 100% {
                transform: scale(.5);
                opacity: .2;
            }

            50% {
                transform: scale(1.7);
                opacity: 1;
            }
        }

        /* =========================
           FLOATING HEARTS
        ========================= */

        .heart {
            position: fixed;
            font-size: 18px;
            opacity: .25;
            animation: floatHeart 8s linear infinite;
            pointer-events: none;
        }

        .heart:nth-child(7) {
            left: 15%;
            bottom: -30px;
            animation-delay: 0s;
        }

        .heart:nth-child(8) {
            left: 35%;
            bottom: -30px;
            animation-delay: 2s;
        }

        .heart:nth-child(9) {
            left: 65%;
            bottom: -30px;
            animation-delay: 4s;
        }

        .heart:nth-child(10) {
            left: 82%;
            bottom: -30px;
            animation-delay: 6s;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: .3;
            }

            85% {
                opacity: .25;
            }

            100% {
                transform: translateY(-110vh) rotate(25deg);
                opacity: 0;
            }
        }

        /* =========================
           MAIN CARD
        ========================= */

        .card {
            width: min(92%, 600px);
            padding: 50px 35px;
            text-align: center;
            position: relative;

            background: rgba(255, 255, 255, .68);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(210, 160, 95, .35);
            border-radius: 30px;

            box-shadow:
                0 25px 70px rgba(126, 74, 92, .15),
                inset 0 1px 0 rgba(255,255,255,.8);

            animation: cardAppear 1.3s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* GOLD CORNERS */

        .corner {
            position: absolute;
            width: 45px;
            height: 45px;
            border-color: rgba(190, 140, 65, .55);
        }

        .corner.tl {
            top: 18px;
            left: 18px;
            border-top: 1px solid;
            border-left: 1px solid;
            border-radius: 12px 0 0 0;
        }

        .corner.tr {
            top: 18px;
            right: 18px;
            border-top: 1px solid;
            border-right: 1px solid;
            border-radius: 0 12px 0 0;
        }

        .corner.bl {
            bottom: 18px;
            left: 18px;
            border-bottom: 1px solid;
            border-left: 1px solid;
            border-radius: 0 0 0 12px;
        }

        .corner.br {
            bottom: 18px;
            right: 18px;
            border-bottom: 1px solid;
            border-right: 1px solid;
            border-radius: 0 0 12px 0;
        }

        /* =========================
           CONTENT
        ========================= */

        .small-text {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #b48a4d;
            margin-bottom: 18px;
            font-weight: 500;
        }

        .heart-icon {
            font-size: 38px;
            margin-bottom: 12px;
            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.12);
            }

            20% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.12);
            }

            40% {
                transform: scale(1);
            }
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(42px, 9vw, 68px);
            line-height: .95;
            font-weight: 600;
            color: #633e50;
            margin-bottom: 15px;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            color: #9b6c7d;
            margin-bottom: 25px;
        }

        .message {
            max-width: 430px;
            margin: 0 auto 30px;
            font-size: 13px;
            line-height: 1.9;
            color: #806471;
            font-weight: 300;
        }

        .mystery {
            font-family: 'Cormorant Garamond', serif;
            font-size: 21px;
            color: #8d5b70;
            font-style: italic;
            margin-bottom: 25px;
        }

        /* =========================
           COUNTDOWN
        ========================= */

        .countdown {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px auto 28px;
        }

        .time-box {
            min-width: 68px;
            padding: 13px 8px;
            background: rgba(255,255,255,.65);
            border: 1px solid rgba(190,140,65,.25);
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(130, 80, 100, .07);
        }

        .time-number {
            font-size: 25px;
            font-weight: 600;
            color: #704759;
        }

        .time-label {
            font-size: 8px;
            letter-spacing: 2px;
            color: #b28b98;
            margin-top: 3px;
        }

        /* =========================
           BUTTON
        ========================= */

        .button {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 50px;
            border: 1px solid rgba(190,140,65,.35);
            background: linear-gradient(135deg, #d9a968, #c99353);
            color: white;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(170,115,60,.25);
            cursor: not-allowed;
            opacity: .55;
            transition: .3s;
        }

        .button.active {
            cursor: pointer;
            opacity: 1;
        }

        .button.active:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(170,115,60,.35);
        }

        .locked {
            font-size: 10px;
            color: #aa8795;
            margin-top: 14px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 28px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            color: #a27b89;
        }

        .footer span {
            color: #c69b55;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .card {
                padding: 42px 22px;
            }

            h1 {
                font-size: 46px;
            }

            .subtitle {
                font-size: 21px;
            }

            .message {
                font-size: 12px;
            }

            .countdown {
                gap: 5px;
            }

            .time-box {
                min-width: 61px;
                padding: 11px 5px;
            }

            .time-number {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <!-- Sparkles -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <!-- Floating Hearts -->
    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♡</div>

    <div class="card">

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="small-text">
            A little secret for
        </div>

        <div class="heart-icon">
            ♡
        </div>

        <h1>
            Alida
        </h1>

        <div class="subtitle">
            Ayuna Iskandar
        </div>

        <p class="message">
            Ada sesuatu yang sudah disiapkan khusus untuk seseorang
            yang akan segera memasuki usia <b>20 tahun</b>.
        </p>

        <div class="mystery">
            “Tapi... belum boleh dibuka sekarang.”
        </div>

        <div class="countdown">

            <div class="time-box">
                <div class="time-number" id="days">00</div>
                <div class="time-label">HARI</div>
            </div>

            <div class="time-box">
                <div class="time-number" id="hours">00</div>
                <div class="time-label">JAM</div>
            </div>

            <div class="time-box">
                <div class="time-number" id="minutes">00</div>
                <div class="time-label">MENIT</div>
            </div>

            <div class="time-box">
                <div class="time-number" id="seconds">00</div>
                <div class="time-label">DETIK</div>
            </div>

        </div>

        <a id="openButton" class="button">
            ✨ Buka Kejutan
        </a>

        <div class="locked" id="lockedText">
            🔒 Masih terkunci... sabar sedikit ya.
        </div>

        <div class="footer">
            Made with <span>♡</span> for Alida
        </div>

    </div>


    <script>

        /*
        ==========================================
        TARGET WAKTU
        19 OKTOBER 2026
        00:00 WIB
        ==========================================
        */

        const targetDate = new Date("2026-10-19T00:00:00+07:00").getTime();

        const daysElement = document.getElementById("days");
        const hoursElement = document.getElementById("hours");
        const minutesElement = document.getElementById("minutes");
        const secondsElement = document.getElementById("seconds");

        const button = document.getElementById("openButton");
        const lockedText = document.getElementById("lockedText");


        function updateCountdown() {

            const now = new Date().getTime();

            const distance = targetDate - now;


            /*
            ==========================================
            JIKA WAKTU SUDAH TIBA
            ==========================================
            */

            if (distance <= 0) {

                daysElement.textContent = "00";
                hoursElement.textContent = "00";
                minutesElement.textContent = "00";
                secondsElement.textContent = "00";

                button.classList.add("active");

                button.href = "birthday.html";

                lockedText.innerHTML =
                    "🔓 Kejutannya sudah terbuka...";

                document.querySelector(".mystery").innerHTML =
                    "“Sekarang... waktunya kamu melihatnya. ♡”";

                return;
            }


            /*
            ==========================================
            HITUNG WAKTU
            ==========================================
            */

            const days = Math.floor(
                distance / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (distance % (1000 * 60 * 60 * 24))
                / (1000 * 60 * 60)
            );

            const minutes = Math.floor(
                (distance % (1000 * 60 * 60))
                / (1000 * 60)
            );

            const seconds = Math.floor(
                (distance % (1000 * 60))
                / 1000
            );


            /*
            ==========================================
            TAMPILKAN
            ==========================================
            */

            daysElement.textContent =
                String(days).padStart(2, "0");

            hoursElement.textContent =
                String(hours).padStart(2, "0");

            minutesElement.textContent =
                String(minutes).padStart(2, "0");

            secondsElement.textContent =
                String(seconds).padStart(2, "0");

        }


        /*
        Jalankan setiap 1 detik
        */

        updateCountdown();

        setInterval(updateCountdown, 1000);


    </script>

</body>
</html>
