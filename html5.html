<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Happy Birthday Alida ♡</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            overflow-x: hidden;
            overflow-y: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #3a2830 0%,
                    #171116 45%,
                    #08070a 100%
                );

            color: #fff;

            font-family: 'Poppins', sans-serif;

            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
        }


        /* =========================================
           CAHAYA LEMBUT
        ========================================= */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            left: 50%;
            top: 45%;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(222, 174, 139, .14),
                    transparent 68%
                );

            filter: blur(20px);

            pointer-events: none;

            z-index: 0;
        }


        /* =========================================
           CONTAINER
        ========================================= */

        .container {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 700px;

            padding: 35px 30px;

            text-align: center;

            animation:
                fadeIn 2s ease forwards;
        }


        /* =========================================
           FOTO
        ========================================= */

        .photo-wrapper {
            width: min(82vw, 350px);

            /*
                Tinggi dibuat mengikuti layar.
                Jadi tidak akan terlalu tinggi di HP.
            */
            height: min(62vh, 440px);
            height: min(62dvh, 440px);

            min-height: 240px;

            margin: 0 auto 30px;

            padding: 7px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #d7b47b,
                    #fff0d0,
                    #b98c54,
                    #ead09c
                );

            box-shadow:
                0 20px 70px rgba(0,0,0,.55);

            animation:
                photoAppear 2s ease forwards;
        }


        .photo-wrapper img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 17px;

            filter:
                saturate(.95)
                brightness(.92);
        }


        /* =========================================
           TEXT
        ========================================= */

        .small-text {
            font-size: 10px;

            letter-spacing: 4px;

            text-transform: uppercase;

            color: #d5b17a;

            margin-bottom: 12px;
        }


        h1 {
            font-family:
                'Cormorant Garamond',
                serif;

            font-size:
                clamp(42px, 8vw, 70px);

            font-weight: 500;

            line-height: 1;

            color: #fff4f5;

            margin-bottom: 15px;
        }


        .subtitle {
            font-family:
                'Cormorant Garamond',
                serif;

            font-size:
                clamp(21px, 4vw, 29px);

            line-height: 1.35;

            color:
                rgba(255, 239, 242, .9);

            max-width: 600px;

            margin: 0 auto 20px;
        }


        .from {
            font-size: 11px;

            letter-spacing: 1px;

            color:
                rgba(255,255,255,.62);

            line-height: 1.8;
        }


        .from strong {
            color: #e0bc87;

            font-weight: 400;
        }


        /* =========================================
           LOVE
        ========================================= */

        .love {
            margin-top: 25px;

            font-family:
                'Cormorant Garamond',
                serif;

            font-size:
                clamp(25px, 5vw, 38px);

            line-height: 1.2;

            color: #f4d7c1;

            opacity: 0;

            animation:
                loveAppear 2s ease 2.5s forwards;
        }


        .heart {
            color: #d7a86c;

            margin-left: 5px;
        }


        /* =========================================
           MUSIC BUTTON
        ========================================= */

        .music-button {
            position: fixed;

            right: max(22px, env(safe-area-inset-right));
            bottom: max(22px, env(safe-area-inset-bottom));

            width: 44px;
            height: 44px;

            border-radius: 50%;

            border: 1px solid
                rgba(218,177,116,.5);

            background:
                rgba(255,255,255,.06);

            color: #e4c18a;

            cursor: pointer;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition:
                .3s ease;

            font-size: 16px;

            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .music-button:hover {
            background:
                rgba(218,177,116,.16);

            transform:
                scale(1.08);
        }


        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes photoAppear {

            from {
                opacity: 0;
                transform:
                    scale(.94);
            }

            to {
                opacity: 1;
                transform:
                    scale(1);
            }

        }


        @keyframes loveAppear {

            from {
                opacity: 0;
                transform:
                    translateY(12px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            body {
                align-items: flex-start;

                overflow-y: auto;

                padding:
                    max(20px, env(safe-area-inset-top))
                    0
                    max(80px, env(safe-area-inset-bottom))
                    0;
            }


            .container {
                width: 100%;

                max-width: 100%;

                padding:
                    25px
                    18px
                    35px;

                margin: auto 0;
            }


            .photo-wrapper {
                width: min(78vw, 290px);

                /*
                    Lebih kecil di HP.
                */
                height: min(52vh, 350px);
                height: min(52dvh, 350px);

                min-height: 210px;

                margin-bottom: 20px;

                padding: 6px;

                border-radius: 19px;
            }


            .photo-wrapper img {
                border-radius: 14px;
            }


            .small-text {
                font-size: 8px;

                letter-spacing: 2.5px;

                margin-bottom: 9px;
            }


            h1 {
                font-size: clamp(39px, 12vw, 52px);

                margin-bottom: 10px;
            }


            .subtitle {
                font-size: clamp(19px, 6vw, 24px);

                line-height: 1.3;

                max-width: 330px;

                margin-bottom: 15px;
            }


            .from {
                font-size: 9.5px;

                line-height: 1.7;

                max-width: 320px;

                margin: 0 auto;
            }


            .love {
                margin-top: 15px;

                font-size: clamp(23px, 7vw, 29px);

                line-height: 1.25;

                padding:
                    0 10px;
            }


            .music-button {
                width: 42px;
                height: 42px;

                right: 16px;
                bottom: 16px;

                font-size: 15px;
            }

        }


        /* =========================================
           HP KECIL
           Contoh: 360 x 640
        ========================================= */

        @media (max-width: 380px) and (max-height: 700px) {

            .container {
                padding-top: 18px;
                padding-bottom: 30px;
            }


            .photo-wrapper {
                width: min(72vw, 250px);

                height: min(43dvh, 285px);

                min-height: 190px;

                margin-bottom: 16px;
            }


            .small-text {
                font-size: 7px;

                letter-spacing: 2px;

                margin-bottom: 7px;
            }


            h1 {
                font-size: 38px;

                margin-bottom: 8px;
            }


            .subtitle {
                font-size: 19px;

                margin-bottom: 12px;
            }


            .from {
                font-size: 8.5px;
            }


            .love {
                margin-top: 12px;

                font-size: 22px;
            }


            .music-button {
                width: 40px;
                height: 40px;

                right: 12px;
                bottom: 12px;
            }

        }


        /* =========================================
           HP LANDSCAPE
        ========================================= */

        @media (max-height: 550px) and (orientation: landscape) {

            body {
                align-items: flex-start;

                overflow-y: auto;
            }


            .container {
                padding:
                    20px
                    20px
                    70px;
            }


            .photo-wrapper {
                width: 190px;

                height: 250px;

                min-height: 0;

                margin-bottom: 15px;
            }


            .small-text {
                font-size: 7px;

                margin-bottom: 7px;
            }


            h1 {
                font-size: 42px;

                margin-bottom: 8px;
            }


            .subtitle {
                font-size: 19px;

                margin-bottom: 10px;
            }


            .from {
                font-size: 9px;
            }


            .love {
                margin-top: 10px;

                font-size: 24px;
            }

        }


        /* =========================================
           DEVICE MODE / LAYAR SANGAT PENDEK
        ========================================= */

        @media (max-height: 650px) {

            .container {
                padding-top: 15px;
                padding-bottom: 70px;
            }


            .photo-wrapper {
                height: min(45dvh, 300px);

                margin-bottom: 15px;
            }


            .small-text {
                margin-bottom: 7px;
            }


            .love {
                margin-top: 12px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================
         MUSIK
         GANTI "lagu.mp3" DENGAN LAGU KAMU
    ========================================== -->

    <audio
        id="birthdayMusic"
        src="lagu.mp3"
        loop>
    </audio>


    <!-- =========================================
         KONTEN UTAMA
    ========================================== -->

    <main class="container">


        <!-- FOTO KALIAN BERDUA -->

        <div class="photo-wrapper">

            <!--
                GANTI FOTO INI DENGAN
                FOTO KALIAN BERDUA

                Nama file:
                foto-kita.jpeg
            -->

            <img
                src="foto-kita.jpeg"
                alt="Faisal dan Alida">

        </div>


        <div class="small-text">
            A little message from me
        </div>


        <h1>
            Happy Birthday
        </h1>


        <div class="subtitle">

            Selamat ulang tahun yang ke-20,
            sayangku Alida.

        </div>


        <div class="from">

            Dari seseorang yang selalu ingin melihatmu bahagia,<br>

            <strong>
                Faisal Rahman Hikmatiar
            </strong>

        </div>


        <div class="love">

            I love you, Alida Ayuna Iskandar

            <span class="heart">♡</span>

        </div>


    </main>


    <!-- =========================================
         TOMBOL MUSIK
    ========================================== -->

    <button
        class="music-button"
        id="musicButton"
        aria-label="Putar musik">

        ♪

    </button>


    <script>

        const music =
            document.getElementById("birthdayMusic");

        const musicButton =
            document.getElementById("musicButton");


        let playing = false;


        /* =========================================
           AUTOPLAY
        ========================================== */

        window.addEventListener("load", () => {

            music.volume = 0.45;

            music.play()
                .then(() => {

                    playing = true;

                    musicButton.textContent = "❚❚";

                })
                .catch(() => {

                    playing = false;

                    musicButton.textContent = "♪";

                });

        });


        /* =========================================
           TOMBOL PLAY / PAUSE
        ========================================== */

        musicButton.addEventListener(
            "click",
            () => {

                if (playing) {

                    music.pause();

                    playing = false;

                    musicButton.textContent = "♪";

                } else {

                    music.play()
                        .then(() => {

                            playing = true;

                            musicButton.textContent = "❚❚";

                        })
                        .catch(() => {

                            playing = false;

                            musicButton.textContent = "♪";

                        });

                }

            }
        );


        /* =========================================
           MEMPERBAIKI VIEWPORT SAAT
           CHROME DEVICE MODE / ROTASI HP
        ========================================== */

        function refreshViewport() {

            document.documentElement.style.setProperty(
                "--screen-height",
                `${window.innerHeight}px`
            );

        }


        window.addEventListener(
            "resize",
            refreshViewport
        );


        window.addEventListener(
            "orientationchange",
            () => {

                setTimeout(
                    refreshViewport,
                    300
                );

            }
        );


        if (window.visualViewport) {

            window.visualViewport.addEventListener(
                "resize",
                refreshViewport
            );

        }


        refreshViewport();

    </script>


</body>
</html>
